name: Build & Deploy WASM (Web)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-wasm-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build WebAssembly
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      EMSDK_VERSION: 6.0.4
      RAYLIB_REF: 5.5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache emsdk
        id: cache-emsdk
        uses: actions/cache@v4
        with:
          path: emsdk
          key: emsdk-${{ env.EMSDK_VERSION }}-${{ runner.os }}
          restore-keys: |
            emsdk-${{ env.EMSDK_VERSION }}-

      - name: Install emsdk
        if: steps.cache-emsdk.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git emsdk
          cd emsdk
          ./emsdk install "$EMSDK_VERSION"
          ./emsdk activate "$EMSDK_VERSION"

      - name: Cache raylib (WASM build)
        id: cache-raylib
        uses: actions/cache@v4
        with:
          path: vendor/raylib
          key: raylib-${{ env.RAYLIB_REF }}-wasm-${{ runner.os }}
          restore-keys: |
            raylib-${{ env.RAYLIB_REF }}-wasm-

      - name: Build with build-wasm.sh
        shell: bash
        run: bash scripts/build-wasm.sh

      - name: Verify build outputs exist
        shell: bash
        run: |
          set -euo pipefail
          for f in index.html index.js index.wasm index.data; do
            if [[ ! -f "out/$f" ]]; then
              echo "::error::Expected build output out/$f not found." >&2
              exit 1
            fi
          done
          echo "Build outputs:"
          ls -lh out/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out/

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
